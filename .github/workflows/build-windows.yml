name: Build Windows App

# This block is what makes the "Run workflow" button appear
on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './htmlrenderer/src-tauri -> target'
          
      - name: Install Node dependencies
        working-directory: ./htmlrenderer
        run: npm install
        
      - name: Build Tauri App and create Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './htmlrenderer'
          tagName: v__VERSION__ 
          releaseName: 'App v__VERSION__'
          releaseDraft: true
          prerelease: false